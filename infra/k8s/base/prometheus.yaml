apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: trading-sim
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "order-service"
        static_configs:
          - targets: ["order-service:8000"]

      - job_name: "market-service"
        static_configs:
          - targets: ["market-service:9000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: trading-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config-volume
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: trading-sim
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090