apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: trading-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: infra-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672/"
            - name: ORDER_QUEUE
              value: "orders"
            - name: DATABASE_URL
              value: "postgresql://trading:trading@postgres:5432/trading"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: trading-sim
spec:
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000